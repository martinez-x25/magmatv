<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Descargar Archivo - MediaFire</title>
    <!-- Importamos la fuente Inter y FontAwesome para los iconos -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .download-card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 40px 30px;
            width: 100%;
            max-width: 420px;
            text-align: center;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3), 0 10px 10px -5px rgba(0, 0, 0, 0.2);
        }

        .icon-container {
            width: 80px;
            height: 80px;
            background: rgba(37, 99, 235, 0.15);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 24px auto;
            color: #3b82f6;
            font-size: 36px;
        }

        h1 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 10px;
            color: #ffffff;
        }

        p {
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 30px;
            line-height: 1.5;
        }

        .download-btn {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            width: 100%;
            background: #2563eb;
            color: #ffffff;
            font-weight: 600;
            font-size: 16px;
            padding: 14px 20px;
            border-radius: 12px;
            text-decoration: none;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.4);
        }

        .download-btn:hover {
            background: #1d4ed8;
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(37, 99, 235, 0.6);
        }

        .download-btn:active {
            transform: translateY(0);
        }

        .footer-note {
            margin-top: 20px;
            font-size: 12px;
            color: #64748b;
        }
    </style>
</head>
<body>

    <div class="download-card">
        <div class="icon-container">
            <i class="fa-solid fa-cloud-arrow-down"></i>
        </div>
        
        <h1>Descarga Segura</h1>
        <p>Haz clic en el botón de abajo para acceder al archivo alojado en MediaFire y comenzar la descarga.</p>
        
        <!-- REEMPLAZA EL 'https://www.mediafire.com/file/rot4uw0tctzxi4z/Lista_de_Magma_TV_-Titan2022_XD.txt/file' POR TU ENLACE DE MEDIAFIRE -->
        <a href="https://www.mediafire.com/file/rot4uw0tctzxi4z/Lista_de_Magma_TV_-Titan2022_XD.txt/file" class="download-btn" target="_blank" rel="noopener noreferrer">
            <i class="fa-solid fa-download"></i> Descargar Archivo
        </a>

        <div class="footer-note">
            Enlace externo vía MediaFire (Promocionado por Sancor Seguros)
        </div>
    </div>

</body>
</html>
